
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="./src/output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>

    <style>
      .card1{
        
      }
    </style>
</head>

<body>

<section class="mx-auto max-w-7xl px-4 py-8">

    <!-- Carousel container -->
    <div id="product-carousel"
         class="relative w-full overflow-hidden rounded-xl"
         data-carousel="slide">

        <!-- Carousel slides -->
        <div class="relative h-80 overflow-hidden rounded-xl">

            <!-- Card 1 -->
            <div class="hidden duration-700 ease-in-out card1" data-carousel-item="active">
                <div class="group relative h-80 w-full overflow-hidden rounded-xl shadow-md">
                    <img src="images/truckimages/chiptruck.png"
                         alt="Waste and refuse truck"
                         class="absolute inset-0 h-full w-full object-cover">

                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>

                    <div class="absolute bottom-0 left-0 w-full p-5 text-white">
                        <p class="mb-1 text-sm font-semibold uppercase tracking-wider text-gray-300">
                            Waste &amp; Refuse
                        </p>
                        <h5 class="text-lg font-bold">
                            2021 Peterbilt 348 6x4
                        </h5>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="hidden duration-700 ease-in-out" data-carousel-item>
                <div class="group relative h-80 w-full overflow-hidden rounded-xl shadow-md">
                    <img src="images/truckimages/buildtruck.png"
                         alt="Service truck"
                         class="absolute inset-0 h-full w-full object-cover">

                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>

                    <div class="absolute bottom-0 left-0 w-full p-5 text-white">
                        <p class="mb-1 text-sm font-semibold uppercase tracking-wider text-gray-300">
                            Service Trucks
                        </p>
                        <h5 class="text-lg font-bold">
                            Ford F600 4x4 Service Truck
                        </h5>
                    </div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="hidden duration-700 ease-in-out" data-carousel-item>
                <div class="group relative h-80 w-full overflow-hidden rounded-xl shadow-md">
                    <img src="trailer.jpg"
                         alt="Flatbed trailer"
                         class="absolute inset-0 h-full w-full object-cover">

                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>

                    <div class="absolute bottom-0 left-0 w-full p-5 text-white">
                        <p class="mb-1 text-sm font-semibold uppercase tracking-wider text-gray-300">
                            Trailers
                        </p>
                        <h5 class="text-lg font-bold">
                            2026 Load King Tag-Along Trailer
                        </h5>
                    </div>
                </div>
            </div>

            <!-- Card 4 -->
            <div class="hidden duration-700 ease-in-out" data-carousel-item>
                <div class="group relative h-80 w-full overflow-hidden rounded-xl shadow-md">
                    <img src="images/truckimages/buildtruck.png"
                         alt="Service vehicle"
                         class="absolute inset-0 h-full w-full object-cover">

                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>

                    <div class="absolute bottom-0 left-0 w-full p-5 text-white">
                        <p class="mb-1 text-sm font-semibold uppercase tracking-wider text-gray-300">
                            Trailers
                        </p>
                        <h5 class="text-lg font-bold">
                            2026 Load King Tag-Along Trailer
                        </h5>
                    </div>
                </div>
            </div>

        </div>

        <!-- Previous button -->
        <button type="button"
                class="group absolute start-0 top-0 z-30 flex h-full cursor-pointer items-center justify-center px-4 focus:outline-none"
                data-carousel-prev>

            <span class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-white/30 group-hover:bg-white/50 group-focus:outline-none group-focus:ring-4 group-focus:ring-white">
                <svg class="h-5 w-5 text-white"
                     aria-hidden="true"
                     xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24">
                    <path stroke="currentColor"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="m15 19-7-7 7-7"/>
                </svg>
                <span class="sr-only">Previous</span>
            </span>
        </button>

        <!-- Next button -->
        <button type="button"
                class="group absolute end-0 top-0 z-30 flex h-full cursor-pointer items-center justify-center px-4 focus:outline-none"
                data-carousel-next>

            <span class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-white/30 group-hover:bg-white/50 group-focus:outline-none group-focus:ring-4 group-focus:ring-white">
                <svg class="h-5 w-5 text-white"
                     aria-hidden="true"
                     xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24">
                    <path stroke="currentColor"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="m9 5 7 7-7 7"/>
                </svg>
                <span class="sr-only">Next</span>
            </span>
        </button>

    </div>

</section>

</body>
</html>
